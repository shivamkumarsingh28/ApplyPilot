[project]
name = "applypilot-backend"
version = "0.1.0"
description = "ApplyPilot API: document vault, notice intelligence, photo studio, form mapping"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "B905", "E501"]  # B008: FastAPI Depends() defaults; B905: zip strict; E501: formatter owns line length
